<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께봇 전문가 채팅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: 친근하고 실무적인 메신저 — 작은 팀이 바로 쓰는 도구
IDEA: 단톡방에 전문가를 '초대'하는 메신저, 봇은 명함처럼 디렉터리에 꽂혀 있음
PICTURE: 작동하는 채팅 화면 자체 — 좌측 방 목록, 가운데 대화, 초대 시트
COLOUR and TYPE: 흰 바탕, 먹색 글자, 코발트 주색, 해바라기 노랑 포인트 / Gothic A1 + Noto Sans KR
LAYOUT: 데스크톱 2단(방 목록 | 대화), 760px 이하 한 화면씩 전환
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1117);--side:light-dark(#f3f4f8,#161922);--ink:light-dark(#16171d,#eef0f6);--mute:light-dark(#5d6170,#a3a8b8);
--line:light-dark(#e2e4ec,#272b38);--pri:light-dark(#2d45e8,#7d8dff);--pri-ink:light-dark(#ffffff,#0f1117);--acc:#ffc531;
--bub:light-dark(#eef0fb,#1d2233);--me:light-dark(#2d45e8,#5468ff);--card:light-dark(#ffffff,#1a1d28)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:"Gothic A1","Noto Sans KR",sans-serif;margin:0;line-height:1.15}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100dvh}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:20px 18px 14px;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--pri);display:grid;place-items:center;flex:none}
.brand h1{font-size:20px;font-weight:800}
.brand small{display:block;color:var(--mute);font-size:13px;font-weight:500}
.org{margin:0 14px 10px;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:left;width:calc(100% - 28px);min-height:44px}
.org b{display:block;font-size:14px}.org span{font-size:13px;color:var(--mute)}
.rooms{flex:1;overflow-y:auto;padding:4px 8px}
.room{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border:0;border-radius:12px;background:none;text-align:left;min-height:56px}
.room[aria-current=true]{background:var(--card);box-shadow:0 1px 0 var(--line)}
.room b{display:block;font-size:15px}.room span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 15px "Gothic A1";color:#fff}
.newroom{margin:10px 14px 16px;min-height:44px;border-radius:12px;border:1.5px dashed var(--line);background:none;font-weight:500}
/* main */
.main{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.top h2{font-size:18px;font-weight:800}
.members{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--mute)}
.members .av{width:26px;height:26px;font-size:11px;margin-left:-6px;border:2px solid var(--bg)}
.back{display:none;border:0;background:none;width:44px;height:44px;margin-left:-8px;font-size:22px}
.spacer{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--pri);color:var(--pri-ink);font-weight:700;white-space:nowrap}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.log{flex:1;overflow-y:auto;padding:20px clamp(12px,3vw,40px);display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:760px}
.msg .av{width:34px;height:34px;font-size:13px}
.msg .who{font-size:13px;color:var(--mute);margin-bottom:3px}
.bubble{background:var(--bub);padding:11px 14px;border-radius:4px 16px 16px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:var(--me);color:#fff;border-radius:16px 4px 16px 16px}
.msg.sys{align-self:center;font-size:13px;color:var(--mute);background:var(--side);padding:6px 14px;border-radius:14px}
.tgbtn{display:flex;align-items:center;gap:6px;padding:0 12px}.tgbtn.on{border-color:#229ED9}
.src{font-size:11px;color:#229ED9;margin-left:6px}
.steps{margin:0;padding-left:1.3em}.steps li{margin:8px 0}
.code{font:800 34px "Gothic A1";letter-spacing:.12em;background:var(--side);border-radius:14px;padding:14px 18px;display:inline-block;margin:8px 0}
.dirh{font-size:15px;margin:20px 0 10px;color:var(--mute)}
.bot .acts{display:flex;gap:8px;flex-wrap:wrap}
.bot textarea{min-height:70px}
.human{font-size:11px;color:#06a77d;margin-left:6px}
.wallet{margin:0 14px 10px;padding:10px 14px;border-radius:12px;background:var(--pri);color:var(--pri-ink);display:flex;justify-content:space-between;align-items:baseline}
.wallet span{font-size:13px;font-weight:500}.wallet b{font:800 22px "Gothic A1"}
.paycard{align-self:center;width:min(440px,100%);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.paycard b{font-size:15px}.paycard .acts{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{min-height:36px;border-radius:18px;border:1.5px solid var(--line);background:none;padding:0 12px}
.chips button[aria-pressed=true]{border-color:var(--pri);color:var(--pri);font-weight:700}
.payerr{font-size:13px;color:#d1453b}
.loginscr{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--side)}
.loginscr[hidden],.app[hidden]{display:none}
.logincard{width:min(400px,100%);background:var(--bg);border-radius:22px;padding:26px 24px;border:1px solid var(--line)}
.me{display:flex;justify-content:space-between;align-items:center;margin:0 14px 14px;font-size:13px;color:var(--mute)}
.me button{border:0;background:none;color:var(--mute);min-height:36px;text-decoration:underline}
.bot .rate{text-align:right;line-height:1.1}.bot .rate b{font:800 22px "Gothic A1";color:#06a77d;display:block}.bot .rate span{font-size:11px;color:var(--mute)}
.prof summary{cursor:pointer;font-size:13px;color:var(--mute);min-height:32px;display:flex;align-items:center}.prof p{font-size:14px;margin:4px 0}
.xtools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.xtools input{flex:1 1 180px}.xtools select{flex:0 1 160px}
.paycalc{font-size:14px;color:var(--mute)}.paycalc b{color:var(--ink)}
.jrate{white-space:nowrap;font-size:12px;color:var(--mute)}.jrate b{font:800 20px "Gothic A1";color:#06a77d}
.docbtn{margin:0 14px 10px;width:calc(100% - 28px);min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-weight:500}
.badge{background:#e8543a;color:#fff;border-radius:10px;font-size:12px;padding:1px 8px;font-weight:700}
.docsheet{width:min(1000px,100%);max-height:94dvh;display:flex;flex-direction:column;gap:12px}
.dochead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.doctabs{display:flex;gap:6px;flex-wrap:wrap}.doctabs button{min-height:40px;border-radius:20px;border:1.5px solid var(--line);background:none;padding:0 14px;font-size:14px}
.doctabs button[aria-pressed=true]{border-color:var(--pri);color:var(--pri);font-weight:700}
.doctabs a{display:inline-flex;align-items:center;min-height:40px;border-radius:20px;border:1.5px solid var(--line);padding:0 14px;font-size:14px;color:inherit;text-decoration:none}
.docview{border:1.5px solid var(--line);border-radius:16px;padding:18px 22px;background:var(--card);overflow-wrap:anywhere;min-height:200px}
.docview h1{font-size:26px;margin:0 0 6px}.docview h2{font-size:19px;margin:22px 0 8px;padding-top:10px;border-top:1px solid var(--line)}.docview h3{font-size:16px}
.docview p,.docview li{font-size:15px}.docview table{border-collapse:collapse;width:100%;font-size:14px}.docview th,.docview td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.docview blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--pri);background:var(--side)}.docview mark{background:#fff1b8;color:#16171d}
.docview[contenteditable=true]{outline:2px dashed var(--pri);outline-offset:2px}
.doctool{display:flex;gap:6px;flex-wrap:wrap}.doctool button{min-height:38px;min-width:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;font-size:14px}
.docsrc{width:100%;min-height:320px;font:13px/1.5 ui-monospace,monospace;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:12px}
.propcard{border:1.5px solid #e8543a;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card)}
.propcard b{font-size:15px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.cmp h4{margin:0 0 6px;font-size:14px;color:var(--mute)}
.chg{border-radius:12px;background:var(--side);padding:10px 14px;font-size:14px}.chg li{margin:3px 0}.chg .add{color:#06784f}.chg .del{color:#c0392b;text-decoration:line-through}
.hist{list-style:none;margin:0;padding:0}.hist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hist .st{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--side)}
.docerr{font-size:14px;color:#d1453b;min-height:20px}.docok{font-size:14px;color:#06784f;min-height:20px}
@media(max-width:760px){.cmp{grid-template-columns:minmax(0,1fr)}.docview{padding:14px}}
.typing{color:var(--mute);font-size:14px;padding:0 4px}
.tools{display:flex;gap:6px;margin-top:6px}
.tools button{border:0;background:none;color:var(--mute);font-size:13px;min-height:32px;padding:0 6px}
.empty{margin:auto;text-align:center;max-width:420px;color:var(--mute)}
.empty h3{color:var(--ink);font-size:22px;margin:14px 0 8px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:8px clamp(12px,3vw,40px) 0}
.quick button{flex:none;min-height:38px;border-radius:19px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:14px}
.compose{display:flex;gap:8px;align-items:flex-end;padding:10px clamp(12px,3vw,40px) 14px}
.to{min-height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;font-size:14px;max-width:150px}
.compose textarea{flex:1;resize:none;min-height:44px;max-height:160px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);padding:10px 16px;font-size:16px}
.note{font-size:13px;color:var(--mute);padding:0 clamp(12px,3vw,40px) 10px}
/* sheet */
.veil{position:fixed;inset:0;background:rgb(10 12 20/.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.veil.open{display:flex}
.sheet{background:var(--bg);width:min(720px,100%);max-height:88dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px clamp(16px,4vw,28px) 28px}
@media(min-width:761px){.veil{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-size:24px;font-weight:800}
.sheet p.lead{color:var(--mute);margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.bot{border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.bot header{display:flex;gap:10px;align-items:center}
.bot b{font-size:16px}.bot .tag{font-size:12px;color:var(--mute)}
.bot p{margin:0;font-size:14px;color:var(--mute)}
.bot .btn{align-self:flex-start;min-height:40px}
.bot.soon{opacity:.62}
.soonchip{font-size:12px;background:var(--side);padding:3px 10px;border-radius:10px;align-self:flex-start}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
.field{width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:10px 12px;font-size:16px}
textarea.field{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
@media(max-width:760px){
 .tgbtn span{display:none}
 .app{grid-template-columns:minmax(0,1fr)}
 .app.chat .side{display:none}.app:not(.chat) .main{display:none}
 .back{display:block}.members span{display:none}
 .top .btn{padding:0 12px}
}
@media(prefers-reduced-motion:no-preference){.msg{animation:in .22s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="loginscr" id="loginScr" hidden>
 <form class="logincard" id="loginForm">
  <div class="brand" style="padding:0 0 18px"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h11a4 4 0 0 1 4 4v3a4 4 0 0 1-4 4H9l-5 3z"/></svg></div><div><h1>함께봇</h1><small>우리 팀에 전문가를 초대하세요</small></div></div>
  <label for="lId">아이디</label><input class="field" id="lId" autocomplete="username" autocapitalize="none" required>
  <label for="lPw">비밀번호</label><input class="field" id="lPw" type="password" autocomplete="current-password" required>
  <div class="row" style="justify-content:stretch"><button class="btn" style="flex:1">로그인</button></div>
  <p class="note" id="loginMsg" style="padding:10px 0 0">계정은 운영 기관(관리자)이 만들어 드려요.</p>
 </form>
</div>
<div class="app" id="app" hidden>
 <aside class="side">
  <div class="brand">
   <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h11a4 4 0 0 1 4 4v3a4 4 0 0 1-4 4H9l-5 3z"/><circle cx="9" cy="11.5" r=".6" fill="#fff"/><circle cx="13.5" cy="11.5" r=".6" fill="#fff"/></svg></div>
   <div><h1>함께봇</h1><small>우리 팀에 전문가를 초대하세요</small></div>
  </div>
  <button class="org" id="orgBtn"><b id="orgName">기업 정보 입력하기</b><span id="orgMission">봇이 우리 기업을 알고 답하도록</span></button>
  <button class="docbtn" id="docBtn" type="button"><span>기업 정보 문서</span><span class="badge" id="docBadge" hidden></span></button>
  <div class="wallet" id="wallet"><span>상담 토큰</span><b id="walletN">0</b></div>
  <nav class="rooms" id="rooms" aria-label="채팅방"></nav>
  <button class="newroom" id="newRoom">+ 새 채팅방</button>
  <div class="me"><span id="meName"></span><button type="button" id="logout">로그아웃</button></div>
 </aside>
 <main class="main">
  <div class="top">
   <button class="back" id="back" aria-label="채팅방 목록">‹</button>
   <div><h2 id="roomTitle"></h2><div class="members" id="members"></div></div>
   <div class="spacer"></div>
   <button class="btn ghost tgbtn" id="tgBtn" aria-label="텔레그램 연결"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#229ED9" d="M21.5 3.6 2.9 10.8c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.4-1.5zM8.4 13.6l9.6-6.1c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.3z"/></svg><span id="tgLabel">텔레그램</span></button>
   <button class="btn" id="inviteBtn">전문가 초대</button>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form class="compose" id="compose">
   <select class="to" id="to" aria-label="받는 봇"></select>
   <textarea id="input" rows="1" placeholder="메시지를 입력하세요" aria-label="메시지"></textarea>
   <button class="btn" id="send" type="submit">보내기</button>
  </form>
  <div class="note" id="note">봇 답변은 초안입니다. 수치·인증·성과는 반드시 직접 확인 후 사용하세요.</div>
 </main>
</div>

<div class="veil" id="inviteVeil" role="dialog" aria-modal="true" aria-labelledby="invTitle">
 <div class="sheet">
  <h3 id="invTitle">전문가 디렉터리</h3>
  <p class="lead" id="dirLead">AI 봇은 바로 답하고, 사람 전문가는 텔레그램으로 호출돼 답장합니다.</p>
  <div id="botGrid"></div>
  <div class="row"><button class="btn ghost" data-close>닫기</button></div>
 </div>
</div>

<div class="veil" id="tgVeil" role="dialog" aria-modal="true" aria-labelledby="tgTitle">
 <div class="sheet">
  <h3 id="tgTitle">텔레그램 그룹 연결</h3>
  <div id="tgBody"></div>
  <div class="row"><button class="btn ghost" data-close>닫기</button></div>
 </div>
</div>

<div class="veil docveil" id="docVeil" role="dialog" aria-modal="true" aria-labelledby="docTitle">
 <div class="sheet docsheet">
  <div class="dochead">
   <div><h3 id="docTitle">기업 정보 문서</h3><div class="note" style="padding:0" id="docMeta"></div></div>
   <button class="btn ghost" type="button" id="docClose">닫기</button>
  </div>
  <div class="doctabs" id="docTabs"></div>
  <div id="docPending"></div>
  <div id="docMain"></div>
 </div>
</div>

<div class="veil" id="orgVeil" role="dialog" aria-modal="true" aria-labelledby="orgTitle">
 <form class="sheet" id="orgForm">
  <h3 id="orgTitle">우리 기업 정보</h3>
  <p class="lead">초대한 봇들이 함께 참고합니다. 서버에 저장되고 웹앱·텔레그램의 모든 봇이 함께 씁니다.</p>
  <label for="fName">기업명</label><input class="field" id="fName" placeholder="예: 마을빵공방 협동조합">
  <label for="fMission">소셜미션</label><textarea class="field" id="fMission" placeholder="예: 경력보유여성 고용, 지역 우리밀 소비 확대"></textarea>
  <label for="fProduct">주요 제품·서비스</label><input class="field" id="fProduct" placeholder="예: 우리밀 통밀빵, 기업 단체 간식">
  <label for="fTarget">주요 고객</label><input class="field" id="fTarget" placeholder="예: 30~40대 동네 주민, 공공기관 구매 담당자">
  <label for="fTone">말투</label>
  <select class="field" id="fTone"><option>따뜻하고 친근하게</option><option>신뢰감 있고 차분하게</option><option>활기차고 경쾌하게</option></select>
  <div class="row"><button type="button" class="btn ghost" data-close>취소</button><button class="btn" type="submit">저장</button></div>
  <details style="margin-top:18px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center">비밀번호 변경</summary>
   <label for="pCur">현재 비밀번호</label><input class="field" id="pCur" type="password" autocomplete="current-password">
   <label for="pNew">새 비밀번호 (8자 이상)</label><input class="field" id="pNew" type="password" autocomplete="new-password">
   <div class="row" style="justify-content:flex-start"><button class="btn ghost" type="button" id="pSave">비밀번호 바꾸기</button></div>
   <p class="note" id="pMsg" style="padding:6px 0 0"></p>
  </details>
 </form>
</div>

<script>
{
let S={org:{},rooms:[],bots:[],telegram:{enabled:false},ai:false}, current=null, typing={};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const botById=id=>S.bots.find(b=>b.id===id);
const room=()=>S.rooms.find(r=>r.id===current)||S.rooms[0];
const av=b=>`<span class="av" style="background:${b?b.color:'#2d45e8'}" aria-hidden="true">${b?esc(b.short):'나'}</span>`;
const expById=id=>(S.experts||[]).find(x=>x.id===id);
const xAv=x=>`<span class="av" style="background:${x.color}" aria-hidden="true">${esc((x.name||'?').slice(0,1))}</span>`;
const tgAv=n=>`<span class="av" style="background:#229ED9" aria-hidden="true">${esc((n||'?').slice(0,1))}</span>`;
const api=async(p,b)=>{const r=await fetch(p,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({error:'응답 오류'}));if(r.status===401&&p!=='/api/login'&&p!=='/api/password'){showLogin();throw new Error('login')}return j};
let es=null;
function showLogin(msg){$('app').hidden=true;$('loginScr').hidden=false;if(es){es.close();es=null}if(msg)$('loginMsg').textContent=msg;setTimeout(()=>$('lId').focus(),0)}

async function load(){
 S=await api('/api/state');
 $('loginScr').hidden=true;$('app').hidden=false;$('meName').textContent=S.me.name+' ('+S.me.loginId+')';
 if(!es)startES();
 try{current=current||localStorage.getItem('hb.room.'+S.me.loginId)}catch(e){}
 if(!S.rooms.find(r=>r.id===current))current=S.rooms[0]&&S.rooms[0].id;
 render();
}
function renderRooms(){
 $('rooms').innerHTML=S.rooms.map(r=>{
  const last=r.msgs.filter(m=>m.from!=='sys').slice(-1)[0], b=botById(r.bots[0]);
  return `<button class="room" data-room="${r.id}" aria-current="${r.id===current}">${b?av(b):'<span class="av" style="background:#9aa0b4">#</span>'}<span><b>${esc(r.name)}${r.tgChatId?'<span class="src">텔레그램</span>':''}</b><span>${last?esc(last.text.slice(0,40)):'전문가를 초대해 보세요'}</span></span></button>`}).join('');
}
function renderTop(){
 const r=room(); if(!r)return;
 $('roomTitle').textContent=r.name;
 const bots=r.bots.filter(id=>botById(id)), hs=(r.humans||[]).map(expById).filter(Boolean);
 $('members').innerHTML=bots.length||hs.length?`<span style="margin-left:6px"></span>${bots.map(id=>av(botById(id))).join('')}${hs.map(xAv).join('')}<span style="margin-left:6px">나 + 봇 ${bots.length}${hs.length?' + 전문가 '+hs.length:''}${r.tgChatId?' · 텔레그램 "'+esc(r.tgTitle||'')+'"':''}</span>`:'<span>아직 초대한 전문가가 없어요</span>';
 const prev=$('to').value;
 $('to').innerHTML=bots.map(id=>`<option value="${id}">${esc(botById(id).name)}</option>`).join('')+'<option value="">봇 없이 보내기</option>';
 if([...$('to').options].some(o=>o.value===prev))$('to').value=prev;
 const cur=botById($('to').value);
 $('quick').innerHTML=cur&&cur.quick?cur.quick.map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join(''):'';
 $('tgBtn').classList.toggle('on',!!r.tgChatId);$('tgLabel').textContent=r.tgChatId?'연결됨':'텔레그램';
 $('note').textContent=!S.ai?'서버에 ANTHROPIC_API_KEY가 없어 봇이 답하지 못해요.':'봇 답변은 초안입니다. 수치·인증·성과는 반드시 직접 확인 후 사용하세요.';
}
function msgHTML(m,i){
 if(m.from==='sys'&&m.join){const j=m.join,head=`<div class="msg sys">${esc(m.text)}</div>`;
  if(j.status)return head+`<div class="msg sys">${j.status==='approved'?'참여를 승인했어요':'참여 요청을 거절했어요'}</div>`;
  const mins=j.rate?Math.floor(S.wallet/j.rate*60):0, low=S.wallet<j.rate;
  return head+`<div class="paycard joincard" data-joinmsg="${m.id}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b>${esc(j.name)} 전문가 참여 요청</b><span class="jrate"><b>${j.rate}</b> 토큰/시간</span></div><div class="paycalc">${esc(j.field)}${j.desc?' · '+esc(j.desc):''}</div>${j.career?`<details class="prof"><summary>경력·자격 보기</summary><p style="white-space:pre-wrap">${esc(j.career)}</p></details>`:''}${j.note?`<div class="bubble" style="border-radius:12px">${esc(j.note)}</div>`:''}<div class="paycalc">승인하면 지금부터 이 전문가의 상담 시간이 따로 계산돼요. 현재 잔액 ${S.wallet}개로 이 전문가는 약 ${mins>=60?Math.floor(mins/60)+'시간 '+(mins%60?mins%60+'분':''):mins+'분'} 상담할 수 있어요.</div>${low?'<div class="payerr">잔액이 이 전문가의 1시간 단가보다 적어요. 승인하면 전문가에게도 이 사실을 알려요.</div>':''}<div class="payerr" data-err></div><div class="acts"><button class="btn" type="button" data-joinok>승인</button><button class="btn ghost" type="button" data-joinno>거절</button></div></div>`}
 if(m.from==='sys'&&m.pay){const x=expById(m.pay.expertId);const head=`<div class="msg sys">${esc(m.text)}</div>`;
  if(m.pay.paid!=null)return head;
  if(!x)return head;
  const sg=m.pay.suggested, chips=[...new Set([sg,1,3,5,10].filter(Boolean))];
  return head+`<div class="paycard" data-pay="${m.id}"><b>${esc(x.name)} 전문가에게 상담 토큰 보내기</b>${sg?`<div class="paycalc">상담 ${m.pay.minutes}분 × 시간당 ${m.pay.rate}토큰 → 계산 <b>${sg}개</b> · 현재 잔액 ${S.wallet}개</div>`:''}${sg&&sg>S.wallet?`<div class="payerr">잔액이 계산값보다 적어요. 지금 잔액만큼 보내거나, 관리자에게 충전받은 뒤 이 카드에서 보낼 수 있어요.</div>`:''}<div class="chips">${chips.map(n=>`<button type="button" data-amt="${n}" aria-pressed="${n===sg}">${n}개${n===sg?' (계산값)':''}</button>`).join('')}</div><input class="field" type="number" inputmode="numeric" min="1" step="1" placeholder="직접 입력 (현재 잔액 ${S.wallet}개)" value="${sg||''}" data-amtin><input class="field" maxlength="200" placeholder="감사 메시지 (선택)" data-memo><div class="payerr" data-err></div><div class="acts"><button class="btn" type="button" data-paysend>보내기</button><button class="btn ghost" type="button" data-payskip>보내지 않기</button></div></div>`}
 if(m.from==='sys')return `<div class="msg sys">${esc(m.text)}</div>`;
 if(m.from==='me')return `<div class="msg me"><div><div class="bubble">${esc(m.text)}</div></div></div>`;
 if(m.from==='tg')return `<div class="msg">${tgAv(m.name)}<div><div class="who">${esc(m.name)}<span class="src">텔레그램</span></div><div class="bubble">${esc(m.text)}</div></div></div>`;
 if(m.from==='hx'){const x=expById(m.expertId)||{name:m.name,color:'#06a77d'};return `<div class="msg">${xAv(x)}<div><div class="who">${esc(m.name)}<span class="human">사람 전문가</span></div><div class="bubble">${esc(m.text)}</div></div></div>`}
 const b=botById(m.from)||{name:'봇',short:'봇',color:'#888'};
 return `<div class="msg">${av(b)}<div><div class="who">${esc(b.name)}</div><div class="bubble">${fmt(m.text)}</div><div class="tools"><button type="button" data-copy="${i}">복사</button>${S.experts.some(x=>x.linked)&&m.id?`<button type="button" data-review="${m.id}">전문가 검토 요청</button>`:''}</div></div></div>`;
}
function renderLog(){
 const r=room(); if(!r)return;
 const t=typing[r.id]?`<div class="typing">${esc((botById(typing[r.id])||{}).name||'봇')}이(가) 쓰는 중…</div>`:'';
 const keep={};document.querySelectorAll('.paycard[data-pay]').forEach(c=>keep[c.dataset.pay]=[c.querySelector('[data-amtin]').value,c.querySelector('[data-memo]').value]);
 $('log').innerHTML=r.msgs.length?r.msgs.map(msgHTML).join('')+t:`<div class="empty"><svg width="120" height="80" viewBox="0 0 120 80" aria-hidden="true"><rect x="6" y="10" width="64" height="40" rx="14" fill="var(--bub)"/><rect x="50" y="30" width="64" height="40" rx="14" fill="var(--pri)"/><circle cx="72" cy="50" r="4" fill="#fff"/><circle cx="84" cy="50" r="4" fill="#fff"/><circle cx="96" cy="50" r="4" fill="var(--acc)"/></svg><h3>아직 조용한 방이에요</h3><p><b>전문가 초대</b>로 봇을 데려오거나, <b>텔레그램</b>으로 그룹을 연결하세요.</p></div>`;
 for(const id in keep){const c=document.querySelector(`.paycard[data-pay="${id}"]`);if(c){c.querySelector('[data-amtin]').value=keep[id][0];c.querySelector('[data-memo]').value=keep[id][1]}}
 $('log').scrollTop=$('log').scrollHeight;
}
function render(){$('walletN').textContent=S.wallet||0;renderRooms();renderTop();renderLog();renderOrg()}

let callOpen=null, reviewMsg=null, xq='', xsort='';
function renderBots(){
 const r=room(), hs=r.humans||[];
 $('dirLead').textContent=reviewMsg?'초안을 검토받을 사람 전문가를 골라 주세요.':'AI 봇은 바로 답하고, 사람 전문가는 텔레그램으로 호출돼 답장합니다.';
 const botCards=S.bots.map(b=>{
  const inRoom=r.bots.includes(b.id);
  return `<div class="bot ${b.soon?'soon':''}"><header>${av(b)}<div><b>${esc(b.name)}</b><div class="tag">${esc(b.tag)}${b.soon?'':' · 텔레그램 /'+esc(b.id)}</div></div></header><p>${esc(b.desc)}</p>${b.soon?'<span class="soonchip">준비 중</span>':inRoom?'<button class="btn ghost" data-kick="'+b.id+'">내보내기</button>':'<button class="btn" data-invite="'+b.id+'">초대하기</button>'}</div>`}).join('');
 const affordable=x=>x.rate?Math.floor(S.wallet/x.rate*60):0;
 const fmtMin=m=>m>=60?`${Math.floor(m/60)}시간${m%60?' '+m%60+'분':''}`:`${m}분`;
 let list=(S.experts||[]).filter(x=>!xq||(x.name+x.field+(x.desc||'')+(x.career||'')).toLowerCase().includes(xq.toLowerCase()));
 if(xsort==='low')list.sort((a,b)=>a.rate-b.rate);if(xsort==='high')list.sort((a,b)=>b.rate-a.rate);
 list.sort((a,b)=>(b.available?1:0)-(a.available?1:0));
 const xCards=list.map(x=>{
  const on=hs.includes(x.id), canPay=S.wallet>=x.rate, wait=(r.pending||[]).some(p=>p.expertId===x.id);
  let act;
  if(reviewMsg) act=on||x.available?`<button class="btn" type="button" data-rv="${x.id}">이 전문가에게 검토 요청</button>`:'<span class="soonchip">지금은 상담 불가</span>';
  else if(wait) act=`<span class="soonchip">전문가 수락 대기 중 (잔액 부족 안내함)</span><div class="acts"><button class="btn ghost" type="button" data-cancelcall="${x.id}">요청 취소</button></div>`;
  else if(callOpen===x.id) act=`<div class="note" style="padding:0">시간당 <b>${x.rate}토큰</b> · 현재 잔액 ${S.wallet}개로 약 <b>${fmtMin(affordable(x))}</b> 상담할 수 있어요.${canPay?'':' <span class="payerr">잔액이 1시간 단가보다 적어서, 바로 연결하지 않고 전문가에게 잔액 상황을 알린 뒤 수락 여부를 물어봐요.</span>'}</div><textarea class="field" id="callText" placeholder="질문을 적어 주세요 (예: 인건비 지원금 정산 서류가 궁금해요)"></textarea><div class="acts"><button class="btn" type="button" data-send="${x.id}">${canPay?'호출하기':'수락 요청 보내기'}</button><button class="btn ghost" type="button" data-cancel>취소</button></div><div class="note" style="padding:0">호출한 때부터 상담 종료까지의 시간으로 토큰을 계산해 안내해요. 실제로 보낼 수량은 종료 후 정할 수 있어요.</div>`;
  else if(on) act=`<div class="acts"><button class="btn ghost" type="button" data-end="${x.id}">상담 종료</button></div>`;
  else if(!x.available) act='<span class="soonchip">지금은 상담 불가</span>';
  else act=`<div class="acts"><button class="btn" type="button" data-call="${x.id}">호출하기</button></div>`;
  const prof=(x.career||x.hours)?`<details class="prof"><summary>프로필 보기</summary>${x.career?`<p style="white-space:pre-wrap">${esc(x.career)}</p>`:''}${x.hours?`<p>상담 가능 시간 · ${esc(x.hours)}</p>`:''}</details>`:'';
  return `<div class="bot"><header>${xAv(x)}<div style="flex:1"><b>${esc(x.name)}</b><div class="tag">${esc(x.field)}${on?' · 상담 중':''}</div></div><div class="rate"><b>${x.rate}</b><span>토큰/시간</span></div></header>${x.desc?`<p>${esc(x.desc)}</p>`:''}${prof}${act}</div>`}).join('');
 const xTools=(S.experts||[]).length>1&&!callOpen?`<div class="xtools"><input class="field" id="xq" placeholder="분야·이름 검색" value="${esc(xq)}" aria-label="전문가 검색"><select class="field" id="xsort" aria-label="정렬"><option value="">기본 순</option><option value="low"${xsort==='low'?' selected':''}>단가 낮은 순</option><option value="high"${xsort==='high'?' selected':''}>단가 높은 순</option></select></div>`:'';
 const tgOff=!S.telegram.enabled?'<p class="note" style="padding:0">사람 전문가 호출은 텔레그램 봇 토큰이 설정돼야 쓸 수 있어요.</p>':'';
 $('botGrid').innerHTML=(reviewMsg?'':`<h4 class="dirh">AI 전문가 봇</h4><div class="grid">${botCards}</div>`)+
  `<h4 class="dirh">사람 전문가 <span style="font-weight:500">· 잔액 ${S.wallet}토큰</span></h4>${tgOff}${xTools}<div class="grid">${xCards||'<p class="note" style="padding:0">아직 등록된 사람 전문가가 없어요. 운영 기관에 요청해 주세요.</p>'}</div>`;
 if(callOpen&&$('callText'))$('callText').focus();
 if($('xq'))$('xq').oninput=e=>{xq=e.target.value;const pos=e.target.selectionStart;renderBots();const q=$('xq');if(q){q.focus();q.setSelectionRange(pos,pos)}};
 if($('xsort'))$('xsort').onchange=e=>{xsort=e.target.value;renderBots()};
}
async function renderTg(){
 const r=room(), el=$('tgBody');
 if(!S.telegram.enabled){el.innerHTML=`<p class="lead">서버에 텔레그램 봇 토큰이 설정되지 않았어요.</p><ol class="steps"><li>텔레그램에서 <b>@BotFather</b>에게 <b>/newbot</b>을 보내 봇을 만들고 토큰을 받으세요.</li><li><b>/setprivacy</b> → 만든 봇 → <b>Disable</b>을 고르세요. 그래야 그룹 대화를 웹앱으로 옮겨올 수 있어요.</li><li>서버의 <b>.env</b>에 <b>TELEGRAM_BOT_TOKEN=</b>토큰 을 넣고 서버를 다시 시작하세요.</li></ol>`;return}
 if(r.tgChatId){el.innerHTML=`<p class="lead">이 방은 텔레그램 <b>"${esc(r.tgTitle||'')}"</b>과(와) 연결돼 있어요. 양쪽 메시지가 서로 전달됩니다.</p><p>텔레그램에서 <b>/mkt 요청내용</b> 또는 <b>@${esc(S.telegram.username)} 요청내용</b>으로 봇을 부르세요.</p><div class="row" style="justify-content:flex-start"><button class="btn ghost" id="unlink">연결 해제</button></div>`;return}
 el.innerHTML='<p class="lead">연결코드를 만드는 중…</p>';
 const j=await api(`/api/rooms/${r.id}/link`,{});
 el.innerHTML=`<p class="lead">텔레그램 그룹을 이 채팅방과 이으면, 그룹에 있는 사람 전문가와 웹앱의 대화가 서로 전달되고 그룹에서도 봇을 부를 수 있어요.</p><ol class="steps"><li>텔레그램 그룹에 <b>@${esc(j.username)}</b>을(를) 멤버로 추가하세요. (그룹을 새로 만들어도 돼요)</li><li>그룹에 아래 명령을 보내세요.<br><span class="code">/link ${esc(j.code)}</span> <button class="btn ghost" id="copyLink" type="button">복사</button></li><li>연결되면 이 창이 자동으로 바뀌어요.</li></ol><p class="note" style="padding:0">1:1 대화로 @${esc(j.username)}에게 말을 걸면 새 채팅방이 자동으로 생겨요.</p>`;
 $('copyLink').onclick=async e=>{try{await navigator.clipboard.writeText('/link '+j.code);e.target.textContent='복사됨'}catch(err){e.target.textContent='직접 입력해 주세요'}};
}
const open=id=>$(id).classList.add('open');
const close=el=>el.closest('.veil').classList.remove('open');

function renderOrg(){const o=S.org||{};$('orgName').textContent=o.name||'기업 정보 입력하기';$('orgMission').textContent=o.mission||'봇이 우리 기업을 알고 답하도록'}
async function send(text){const r=room();await api(`/api/rooms/${r.id}/messages`,{text,to:$('to').value||null})}

/* events */
$('rooms').addEventListener('click',e=>{const t=e.target.closest('[data-room]');if(!t)return;current=t.dataset.room;try{localStorage.setItem('hb.room.'+S.me.loginId,current)}catch(err){}$('app').classList.add('chat');render()});
$('back').onclick=()=>{$('app').classList.remove('chat');renderRooms()};
$('newRoom').onclick=async()=>{const r=await api('/api/rooms',{name:'새 채팅방 '+(S.rooms.length+1)});current=r.id;$('app').classList.add('chat');await load()};
$('roomTitle').onclick=()=>{const r=room();const el=$('roomTitle');el.contentEditable=true;el.focus();el.onblur=()=>{el.contentEditable=false;const n=el.textContent.trim();if(n&&n!==r.name)api(`/api/rooms/${r.id}/rename`,{name:n})};el.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}}};
$('inviteBtn').onclick=()=>{reviewMsg=null;callOpen=null;renderBots();open('inviteVeil')};
$('tgBtn').onclick=()=>{open('tgVeil');renderTg()};
$('tgBody').addEventListener('click',async e=>{if(e.target.id==='unlink'){await api(`/api/rooms/${room().id}/unlink`,{});close(e.target)}});
$('botGrid').addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const r=room(),d=t.dataset;
 const post=async(p,b)=>{const j=await api(p,b);if(j&&j.error)$('dirLead').textContent=j.error;return j};
 if(d.invite){await post(`/api/rooms/${r.id}/invite`,{botId:d.invite});close(t);return}
 if(d.kick){await post(`/api/rooms/${r.id}/kick`,{botId:d.kick})}
 if(d.call){callOpen=d.call}
 if(d.cancel!==undefined){callOpen=null}
 if(d.send){const text=$('callText').value.trim();callOpen=null;await post(`/api/rooms/${r.id}/call`,{expertId:d.send,text});close(t);return}
 if(d.end){await post(`/api/rooms/${r.id}/end`,{expertId:d.end})}
 if(d.cancelcall){await post(`/api/rooms/${r.id}/cancelcall`,{expertId:d.cancelcall})}
 if(d.rv){const m=reviewMsg;reviewMsg=null;await post(`/api/rooms/${r.id}/review`,{expertId:d.rv,msgId:m});close(t);return}
 await load();renderBots();
});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b));
document.querySelectorAll('.veil').forEach(v=>v.addEventListener('click',e=>{if(e.target===v)v.classList.remove('open')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.veil.open').forEach(v=>v.classList.remove('open'))});
$('to').onchange=renderTop;
$('quick').addEventListener('click',e=>{const q=e.target.closest('[data-q]');if(q)send(q.dataset.q)});
$('compose').addEventListener('submit',e=>{e.preventDefault();const t=$('input').value.trim();if(!t)return;$('input').value='';$('input').style.height='';send(t)});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('compose').requestSubmit()}});
$('input').addEventListener('input',e=>{const t=e.target;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'});
$('log').addEventListener('input',e=>{const c=e.target.closest('.paycard');if(c&&e.target.matches('[data-amtin]'))c.querySelectorAll('[data-amt]').forEach(b=>b.setAttribute('aria-pressed','false'))});
$('log').addEventListener('click',async e=>{
 const jc=e.target.closest('.joincard');
 if(jc){const t=e.target.closest('button');if(!t)return;const ok=t.hasAttribute('data-joinok');if(!ok&&!t.hasAttribute('data-joinno'))return;
  if(!ok&&t.textContent!=='정말 거절할까요?'){t.textContent='정말 거절할까요?';return}
  t.disabled=true;const j=await api(`/api/rooms/${room().id}/join`,{msgId:jc.dataset.joinmsg,approve:ok});if(j.error){jc.querySelector('[data-err]').textContent=j.error;t.disabled=false}return}
 const card=e.target.closest('.paycard');
 if(card){const t=e.target.closest('button');if(!t)return;const r=room(),inp=card.querySelector('[data-amtin]'),err=card.querySelector('[data-err]');
  if(t.dataset.amt){card.querySelectorAll('[data-amt]').forEach(b=>b.setAttribute('aria-pressed',b===t));inp.value=t.dataset.amt;return}
  if(t.hasAttribute('data-payskip')){if(t.textContent!=='정말 보내지 않을까요?'){t.textContent='정말 보내지 않을까요?';return}await api(`/api/rooms/${r.id}/pay`,{msgId:card.dataset.pay,skip:true});return}
  if(t.hasAttribute('data-paysend')){const amt=+inp.value;if(!Number.isInteger(amt)||amt<1){err.textContent='1 이상의 정수를 입력해 주세요';return}if(amt>S.wallet){err.textContent=`잔액이 부족해요 (현재 ${S.wallet}개). 관리자에게 충전을 요청해 주세요.`;return}
   t.disabled=true;t.textContent='보내는 중…';const j=await api(`/api/rooms/${r.id}/pay`,{msgId:card.dataset.pay,amount:amt,memo:card.querySelector('[data-memo]').value});if(j.error){err.textContent=j.error;t.disabled=false;t.textContent='보내기'}}
  return}const rv=e.target.closest('[data-review]');if(rv){const r=room(),hs=(r.humans||[]).filter(id=>(expById(id)||{}).linked);if(hs.length===1){rv.textContent='보내는 중…';await api(`/api/rooms/${r.id}/review`,{expertId:hs[0],msgId:rv.dataset.review})}else{reviewMsg=rv.dataset.review;renderBots();open('inviteVeil')}return}
 const c=e.target.closest('[data-copy]');if(!c)return;try{await navigator.clipboard.writeText(room().msgs[+c.dataset.copy].text);c.textContent='복사됨'}catch(err){c.textContent='복사 안 됨'}});
$('orgBtn').onclick=()=>{const o=S.org||{};$('fName').value=o.name||'';$('fMission').value=o.mission||'';$('fProduct').value=o.product||'';$('fTarget').value=o.target||'';if(o.tone)$('fTone').value=o.tone;open('orgVeil')};
$('orgForm').addEventListener('submit',async e=>{e.preventDefault();if(e.submitter&&e.submitter.id==='pSave')return;await api('/api/org',{name:$('fName').value.trim(),mission:$('fMission').value.trim(),product:$('fProduct').value.trim(),target:$('fTarget').value.trim(),tone:$('fTone').value});close($('orgForm'))});

/* 로그인 */
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const j=await api('/api/login',{loginId:$('lId').value.trim(),password:$('lPw').value});if(j.error){$('loginMsg').textContent=j.error;return}$('lPw').value='';current=null;load().catch(()=>{})});
$('logout').onclick=async()=>{await api('/api/logout',{}).catch(()=>{});showLogin('로그아웃했어요.')};
$('pSave').onclick=async()=>{const j=await api('/api/password',{current:$('pCur').value,next:$('pNew').value});$('pMsg').textContent=j.error||'비밀번호를 바꿨어요. 다른 기기의 로그인은 끊겼어요.';if(!j.error){$('pCur').value='';$('pNew').value=''}};

/* 실시간 */
let t=null;
function startES(){
es=new EventSource('/api/events');
es.onerror=()=>{if(es&&es.readyState===2){es=null;load().catch(()=>{})}};
es.addEventListener('room',e=>{const d=JSON.parse(e.data);if(d.roomId)delete typing[d.roomId];clearTimeout(t);t=setTimeout(async()=>{const wasTg=room()&&room().tgChatId;await load();if($('tgVeil').classList.contains('open')&&!wasTg&&room().tgChatId)renderTg()},120)});
es.addEventListener('typing',e=>{const d=JSON.parse(e.data);typing[d.roomId]=d.botId;if(room()&&room().id===d.roomId)renderLog()});
es.addEventListener('doc',async()=>{await loadDoc();if($('docVeil').classList.contains('open')&&docMode!=='edit')renderDoc()});
}

/* ===== 기업 정보 문서 ===== */
let DOCS=null, docMode='view', docSel=null, docDirty=false;
const whenD=t=>new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const byL=b=>b?(b.kind==='expert'?b.name+' 전문가':b.kind==='org'?b.name+' (기업)':b.name):'';
async function loadDoc(){try{DOCS=await api('/api/doc');const n=DOCS.pending.length;$('docBadge').hidden=!n;$('docBadge').textContent=n?n+'건 확인 필요':'';}catch(e){}}
function blocks(html){const d=document.createElement('div');d.innerHTML=html;return [...d.querySelectorAll('h1,h2,h3,h4,p,li,td,th,blockquote,pre,dt,dd')].map(e=>e.textContent.trim()).filter(Boolean)}
function changes(a,b){const A=blocks(a),B=blocks(b),sa=new Set(A),sb=new Set(B);const add=B.filter(x=>!sa.has(x)),del=A.filter(x=>!sb.has(x));
 if(!add.length&&!del.length)return '<div class="chg">글 내용은 같고 모양(제목·목록 등)만 바뀌었어요.</div>';
 return `<div class="chg"><b>바뀐 내용</b><ul>${del.slice(0,30).map(x=>`<li class="del">− ${esc(x.slice(0,200))}</li>`).join('')}${add.slice(0,30).map(x=>`<li class="add">+ ${esc(x.slice(0,200))}</li>`).join('')}</ul>${add.length+del.length>60?'<div class="note" style="padding:0">바뀐 곳이 많아 일부만 보여요.</div>':''}</div>`}
function renderDoc(){
 if(!DOCS)return;const c=DOCS.current;
 $('docMeta').textContent=`현재 v${c.n} · ${whenD(c.at)} · ${byL(c.by)}${c.note?' · '+c.note:''}`;
 const tab=(m,l)=>`<button type="button" data-dmode="${m}" aria-pressed="${docMode===m}">${l}</button>`;
 $('docTabs').innerHTML=tab('view','보기')+tab('edit','편집')+tab('history','버전 기록')+`<button type="button" id="docGen">함께봇으로 대화 정리</button><a href="/api/doc/download?id=${c.id}">HTML 내려받기</a>`;
 $('docPending').innerHTML=DOCS.pending.map(p=>`<div class="propcard"><div><b>수정안 v${p.n} · ${esc(byL(p.by))}</b><div class="note" style="padding:0">${whenD(p.at)}${p.note?' · '+esc(p.note):''}${p.base&&p.basedOn!==c.id?` · v${p.base}를 바탕으로 고친 안 (지금은 v${c.n})`:''}</div></div><button class="btn" type="button" data-cmp="${p.id}">비교하고 결정하기</button></div>`).join('');
 const m=$('docMain');
 if(docMode==='view')m.innerHTML=`<div class="docview">${c.html}</div><p class="note" style="padding:0">이 문서는 함께봇의 AI 전문가와 상담 중인 사람 전문가가 우리 기업을 이해하는 데 쓰여요. 사람 전문가는 상담 중에만 볼 수 있어요.</p>`;
 else if(docMode==='edit'){const src=docSel&&docSel.edit?docSel.html:c.html;
  m.innerHTML=`<div class="doctool" id="docTool"><button type="button" data-cmd="formatBlock" data-v="H2">큰 제목</button><button type="button" data-cmd="formatBlock" data-v="H3">작은 제목</button><button type="button" data-cmd="formatBlock" data-v="P">본문</button><button type="button" data-cmd="bold"><b>굵게</b></button><button type="button" data-cmd="insertUnorderedList">• 목록</button><button type="button" data-cmd="insertOrderedList">1. 목록</button><button type="button" data-cmd="undo">되돌리기</button><button type="button" id="docSrcBtn">HTML 보기</button></div>
  <div class="docview" id="docEd" contenteditable="true">${src}</div><textarea class="docsrc" id="docSrc" hidden aria-label="HTML 원본"></textarea>
  <input class="field" id="docNote" maxlength="200" placeholder="무엇을 바꿨는지 짧게 (선택)">
  <div class="docerr" id="docErr"></div><div class="acts"><button class="btn" type="button" id="docSave">${docSel&&docSel.edit?`수정안 v${docSel.n}을 고쳐서 승인`:'새 버전으로 저장'}</button><button class="btn ghost" type="button" data-dmode="view">취소</button></div>
  <p class="note" style="padding:0">저장하면 새 버전이 되고, 이전 버전은 "버전 기록"에서 언제든 되돌릴 수 있어요. 스크립트·색상 같은 서식은 안전을 위해 저장할 때 빠져요.</p>`;
  docDirty=false;$('docEd').addEventListener('input',()=>docDirty=true);}
 else if(docMode==='compare'){const p=DOCS.pending.find(x=>x.id===docSel);if(!p){docMode='view';return renderDoc()}
  m.innerHTML=`${p.basedOn!==c.id?`<div class="payerr">이 수정안은 v${p.base||'?'}를 바탕으로 만들어졌고, 그 뒤 문서가 v${c.n}으로 바뀌었어요. 승인하면 v${c.n}의 내용 대신 이 수정안이 현재 문서가 돼요.</div>`:''}${changes(c.html,p.html)}
  <div class="cmp"><div><h4>현재 v${c.n}</h4><div class="docview">${c.html}</div></div><div><h4>수정안 v${p.n} · ${esc(byL(p.by))}</h4><div class="docview">${p.html}</div></div></div>
  <input class="field" id="docReason" maxlength="200" placeholder="거절 사유 (선택, 전문가에게 전달돼요)">
  <div class="docerr" id="docErr"></div><div class="acts"><button class="btn" type="button" data-approve="${p.id}">승인해서 반영</button><button class="btn ghost" type="button" data-editprop="${p.id}">고쳐서 승인</button><button class="btn ghost" type="button" data-reject="${p.id}">거절</button></div>`;}
 else if(docMode==='history'){
  m.innerHTML=`<ul class="hist">${DOCS.history.map(v=>`<li><div><b>v${v.n}</b> ${v.id===c.id?'<span class="st">현재</span>':v.status==='rejected'?'<span class="st">거절됨</span>':''} · ${whenD(v.at)} · ${esc(byL(v.by))}<div class="note" style="padding:0">${esc(v.note||'')}</div></div><div class="acts"><button class="btn ghost" type="button" data-see="${v.id}">보기</button>${v.status==='approved'&&v.id!==c.id?`<button class="btn ghost" type="button" data-revert="${v.id}">이 버전으로 되돌리기</button>`:''}<a class="btn ghost" style="display:inline-flex;align-items:center;text-decoration:none" href="/api/doc/download?id=${v.id}">내려받기</a></div></li>`).join('')}</ul><div class="docerr" id="docErr"></div><div id="docSee"></div>`;}
}
const docErr=(t,ok)=>{const e=$('docErr');if(e){e.className=ok?'docok':'docerr';e.textContent=t}};
async function openDoc(){await loadDoc();docMode='view';docSel=null;renderDoc();open('docVeil')}
$('docBtn').onclick=openDoc;
$('docClose').onclick=()=>{if(docMode==='edit'&&docDirty&&$('docClose').textContent!=='저장 안 하고 닫기'){$('docClose').textContent='저장 안 하고 닫기';return}$('docClose').textContent='닫기';$('docVeil').classList.remove('open')};
$('docVeil').addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.dmode){if(docMode==='edit'&&docDirty&&d.dmode!=='edit'&&t.textContent!=='저장 안 하고 나가기'){t.textContent='저장 안 하고 나가기';return}docMode=d.dmode;docSel=null;return renderDoc()}
 if(d.cmd){e.preventDefault();$('docEd').focus();document.execCommand(d.cmd,false,d.v||null);docDirty=true;return}
 if(t.id==='docSrcBtn'){const ed=$('docEd'),src=$('docSrc');if(src.hidden){src.value=ed.innerHTML;src.hidden=false;ed.hidden=true;t.textContent='편집 화면 보기';src.oninput=()=>docDirty=true}else{ed.innerHTML=src.value;src.hidden=true;ed.hidden=false;t.textContent='HTML 보기'}return}
 if(t.id==='docSave'){const src=$('docSrc'),html=src.hidden?$('docEd').innerHTML:src.value;t.disabled=true;
  let j;if(docSel&&docSel.edit)j=await api('/api/doc/approve',{id:docSel.id,html});
  else j=await api('/api/doc/save',{html,note:$('docNote').value,basedOn:DOCS.current.id,force:t.dataset.force==='1'});
  t.disabled=false;if(j.error){docErr(j.error);if(/바뀌었어요/.test(j.error)){t.dataset.force='1';t.textContent='그래도 저장'}return}
  docDirty=false;await loadDoc();docMode='view';docSel=null;renderDoc();return}
 if(t.id==='docGen'){t.disabled=true;t.textContent='정리하는 중… (최대 1분)';const j=await api('/api/doc/generate',{});await loadDoc();
  if(j.error){docMode='view';renderDoc();$('docMain').insertAdjacentHTML('afterbegin',`<div class="docerr">${esc(j.error)}</div>`);return}
  docMode='compare';docSel=j.id;return renderDoc()}
 if(d.cmp){docMode='compare';docSel=d.cmp;return renderDoc()}
 if(d.approve){t.disabled=true;const j=await api('/api/doc/approve',{id:d.approve});if(j.error){t.disabled=false;return docErr(j.error)}await loadDoc();docMode='view';docSel=null;return renderDoc()}
 if(d.reject){if(t.textContent!=='정말 거절할까요?'){t.textContent='정말 거절할까요?';return}const j=await api('/api/doc/reject',{id:d.reject,reason:$('docReason').value});if(j.error)return docErr(j.error);await loadDoc();docMode='view';docSel=null;return renderDoc()}
 if(d.editprop){const p=DOCS.pending.find(x=>x.id===d.editprop);docMode='edit';docSel={edit:true,id:p.id,n:p.n,html:p.html};return renderDoc()}
 if(d.see){const v=await api('/api/doc/version?id='+d.see);$('docSee').innerHTML=`<h4 style="margin:14px 0 6px">v${v.n} 내용</h4>${v.id!==DOCS.current.id?changes(DOCS.current.html,v.html).replace('바뀐 내용','현재 문서와 다른 점'):''}<div class="docview">${v.html}</div>`;$('docSee').scrollIntoView({behavior:'smooth'});return}
 if(d.revert){if(t.textContent!=='정말 되돌릴까요?'){t.textContent='정말 되돌릴까요?';return}const j=await api('/api/doc/revert',{id:d.revert});if(j.error)return docErr(j.error);await loadDoc();docMode='history';renderDoc();docErr(`v${j.n}으로 저장했어요 (되돌린 내용). 이전 버전들은 그대로 남아 있어요.`,true);return}
});

load().then(loadDoc).catch(()=>{});
}
